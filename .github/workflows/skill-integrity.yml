name: Skill Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ORGX_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check OrgX skill tool drift
        run: python3 scripts/check_skill_tool_drift.py
      - name: Check product artifact validation regressions
        run: python3 -B -m unittest discover -s product-agent/scripts -p 'test_validate_artifact.py' -v
